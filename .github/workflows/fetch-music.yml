name: Fetch music file (one-time)

on:
  push:
    branches: ["arena/76ef4c77-happy-20th-birthday"]
    paths: [".github/workflows/fetch-music.yml", "music-fetch-trigger.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the track from Jumpshare CDN
        run: |
          curl -fL --retry 3 -o lovely.mp3 "https://cdn.jumpshare.com/download/JU-3uXyKsuF8lMM4ePzenuGWmxtQdCKPuZpV3XifJisPJ-hll5kB3MokpgNd9PPgLupXZLhOEb5cv5GgcF7dtKb5RW6_a-qVqU5Z46JHJVg"
          ls -la lovely.mp3
          file lovely.mp3 || true

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovely-music
          path: lovely.mp3
          retention-days: 3
