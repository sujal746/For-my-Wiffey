name: Fetch music file (one-time)

on:
  push:
    branches: ["arena/76ef4c77-happy-20th-birthday"]
    paths: [".github/workflows/fetch-music.yml", "music-fetch-trigger.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the track from Jumpshare CDN
        run: |
          mkdir -p public
          curl -fL --retry 3 -o public/lovely.mp3 "https://cdn.jumpshare.com/download/JU-3uXyKsuF8lMM4ePzenuGWmxtQdCKPuZpV3XifJisPJ-hll5kB3MokpgNd9PPgLupXZLhOEb5cv5GgcF7dtKb5RW6_a-qVqU5Z46JHJVg"
          ls -la public/lovely.mp3
          file public/lovely.mp3 || true

      - name: Commit the track back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lovely.mp3
          git commit -m "Add Lovely music track (via fetch workflow)" || echo "nothing to commit"
          git push
